<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 4rem; }
        form { display: flex; flex-direction: column; gap: 0.75rem; width: 20rem; }
        label { font-weight: 600; }
        input { padding: 0.5rem; }
        .error { color: #b00020; min-height: 1.2rem; }
        .field-error { color: #b00020; font-size: 0.85rem; }
        button { padding: 0.6rem; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <h1>Sign in</h1>
    <form id="login-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <span class="field-error" id="email-error"></span>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <span class="field-error" id="password-error"></span>

        <div class="error" id="form-error" role="alert"></div>
        <button type="submit">Log in</button>
    </form>
</main>
<script>
    const form = document.getElementById('login-form');
    const formError = document.getElementById('form-error');
    const emailError = document.getElementById('email-error');
    const passwordError = document.getElementById('password-error');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        formError.textContent = '';
        emailError.textContent = '';
        passwordError.textContent = '';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        let valid = true;
        if (!email) {
            emailError.textContent = 'Email is required';
            valid = false;
        }
        if (!password) {
            passwordError.textContent = 'Password is required';
            valid = false;
        }
        if (!valid) {
            return;
        }

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await response.json().catch(() => ({}));

            if (response.ok) {
                window.location.href = data.redirectUrl || '/home.html';
                return;
            }

            if (data.fieldErrors) {
                emailError.textContent = data.fieldErrors.email || '';
                passwordError.textContent = data.fieldErrors.password || '';
            }
            formError.textContent = data.error || 'Unable to log in';
        } catch (error) {
            formError.textContent = 'Unable to log in. Please try again.';
        }
    });
</script>
</body>
</html>
